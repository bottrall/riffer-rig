# Every guide page on the docs site, in reading order. `source` is relative to
# docs/; `slug` becomes the page URL (/guides/<slug>/). Page titles come from
# each file's first H1 at build time. Adding a page under docs/ requires an
# entry here — the build fails on any mismatch.
groups:
  - label: Start here
    tone: teal
    pages:
      - source: OVERVIEW.md
        slug: overview
        description: What riffer-rig is, how it fits together, and a glossary
      - source: GETTING_STARTED.md
        slug: getting-started
        featured: true
        description: Install, pick a model, first session
      - source: TROUBLESHOOTING.md
        slug: troubleshooting
        description: Common errors, what causes them, and the fix

  - label: Using the terminal
    tone: rose
    pages:
      - source: TERMINAL.md
        slug: terminal
        description: The input line and its keys, queueing, the status line, peek, commands
      - source: CLI.md
        slug: cli
        description: Every flag and environment variable
      - source: CONFIGURATION.md
        slug: configuration
        description: Settings, where each value comes from, and every core key
      - source: INSTRUCTIONS.md
        slug: instructions
        description: How the system message is built; AGENTS.md
      - source: TOOLS.md
        slug: tools
        description: The bundled tools, background jobs, and what runs without asking
      - source: SKILLS.md
        slug: skills
        description: Agent Skills directories and activation
      - source: MCP.md
        slug: mcp
        description: Declaring MCP servers
      - source: RELOADING.md
        slug: reloading
        description: What reloads, when, and what needs a restart
      - source: SESSIONS.md
        slug: sessions
        description: Resuming, the picker, /trace, opting out
      - source: HEADLESS.md
        slug: headless
        description: riffer -p, NDJSON, exit codes
      - source: ACP.md
        slug: acp
        description: riffer acp, the ACP agent over stdio

  - label: Extending and embedding
    tone: gold
    pages:
      - source: EXTENSIONS.md
        slug: extensions
        description: A complete example, rig.rb, the eight seams, hooks, gems
      - source: EMBEDDING.md
        slug: embedding
        description: Runtime and Loader from Ruby; cancelling, snapshots, background jobs
      - source: EVENTS.md
        slug: events
        description: The event stream, and the order of tool call events
      - source: HOSTS.md
        slug: hosts
        description: A minimal host, the host interface, and the shipped hosts
      - source: STORES.md
        slug: stores
        description: Saving sessions to your own store

  - label: Providers
    tone: teal
    pages:
      - source: PROVIDERS.md
        slug: providers/overview
        description: Credentials, SDK gems, auth.json, /auth
      - source: CUSTOM_PROVIDERS.md
        slug: providers/custom
        description: Registering a provider from an extension
