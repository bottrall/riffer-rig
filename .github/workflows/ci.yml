name: ci

on:
  pull_request:
  # Renovate merges green branches without a PR, so it needs CI on the push.
  push:
    branches:
      - "renovate/**"

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: bin/lint
          - name: typecheck
            run: bin/typecheck
          - name: gemspec
            run: bundle exec rake gemspec:check
          - name: docs
            run: bundle exec rake docs docs:check

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ${{ matrix.run }}

  test:
    runs-on: ubuntu-latest
    name: test ${{ matrix.ruby }}

    strategy:
      matrix:
        ruby:
          - "4.0"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bin/test
