name: ci

on:
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: bin/lint
          - name: typecheck
            run: bin/typecheck
          - name: build
            run: bin/build
          - name: docs
            run: bin/docs --check

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ${{ matrix.run }}

  test:
    runs-on: ubuntu-latest
    name: test ${{ matrix.ruby }}

    strategy:
      matrix:
        ruby:
          - "4.0"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bin/test
