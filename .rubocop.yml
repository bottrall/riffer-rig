plugins:
  - rubocop-bottrall

inherit_gem:
  rubocop-bottrall:
    - config/base.yml
    - config/rbs-inline.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  # The oldest Ruby the gemspec supports.
  TargetRubyVersion: 3.3

Bottrall/NoInheritance:
  # riffer's framework-mandated parents: its tools, agents, guardrails, skill
  # backends and messages are defined by subclassing them.
  AllowedParents:
    - Riffer::Agent
    - Riffer::Guardrail
    - Riffer::Messages::User
    - Riffer::Skills::Backend
    - Riffer::Tool
    - Riffer::Tools::Runtime

Bottrall/NoMocking:
  # The gem's own code, which tests fake by injection rather than patching.
  OwnedNamespaces:
    - Riffer::Rig

Lint/InheritException:
  Exclude:
    # Abort::Signal has to escape the `rescue StandardError` in provider SDKs.
    - "lib/riffer/rig/runtime/abort.rb"

Lint/UnusedMethodArgument:
  # A keyword is part of the call shape a contract fixes (a host's `notify`
  # takes `level:`, a guardrail's `process_input` takes `context:`), and
  # renaming an unused one to `_name` would change the keyword callers pass.
  AllowUnusedKeywordArguments: true
  Exclude:
    # rbs-inline leaves a `_`-prefixed parameter untyped, so the null host
    # keeps the contract's parameter names.
    - "lib/riffer/rig/hosts/null.rb"
    # Same reason: the mixin writes out its declines with the contract's
    # parameter names.
    - "lib/riffer/rig/hosts/non_interactive.rb"

Naming/PredicateMethod:
  AllowedMethods:
    # RuboCop's default, restated because this list replaces it.
    - call
    # Hosts::_Host#confirm is a blocking prompt named by the host contract,
    # not a predicate.
    - confirm

Style/ClassAndModuleChildren:
  Exclude:
    # The gemspec loads version.rb before riffer, so it has to nest.
    - "lib/riffer/rig/version.rb"
