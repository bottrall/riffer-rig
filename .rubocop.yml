plugins:
  - rubocop-bottrall

inherit_gem:
  rubocop-bottrall:
    - config/base.yml
    - config/rbs-inline.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 4.0
  Exclude:
    - "exe/**/*"

Bottrall/NoInheritance:
  AllowedParents:
    - Riffer::Agent
    - Riffer::Guardrail
    - Riffer::Messages::User
    - Riffer::Skills::Backend
    - Riffer::Tool
    - Riffer::Tools::Runtime
  Include:
    - "lib/**/*.rb"
    - "test/**/*.rb"

Bottrall/NoMocking:
  OwnedNamespaces:
    - Riffer::Rig
  Include:
    - "test/**/*_test.rb"

Lint/InheritException:
  Exclude:
    # Abort::Signal has to escape the `rescue StandardError` in provider SDKs.
    - "lib/riffer/rig/runtime/abort.rb"

Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true
  Exclude:
    # rbs-inline leaves a `_`-prefixed parameter untyped, so the null host
    # keeps the contract's parameter names.
    - "lib/riffer/rig/hosts/null.rb"
    # Same reason: the mixin writes out its declines with the contract's
    # parameter names.
    - "lib/riffer/rig/hosts/non_interactive.rb"

Naming/PredicateMethod:
  AllowedMethods:
    - call
    # Hosts::_Host#confirm is a blocking prompt named by the host contract,
    # not a predicate.
    - confirm

Style/ClassAndModuleChildren:
  Exclude:
    # The gemspec loads version.rb before riffer, so it has to nest.
    - "lib/riffer/rig/version.rb"
