require:
  - ./rubocop/cop/rig/no_inline_rbs_declarations

plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "exe/**/*"
    - "sig/**/*"
    - "vendor/**/*"

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/FirstMethodParameterLineBreak:
  Enabled: true

Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

Layout/RedundantLineBreak:
  Enabled: true
  InspectBlocks: false

Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true
  Exclude:
    # rbs-inline leaves a `_`-prefixed parameter untyped, so the null host
    # keeps the contract's parameter names.
    - "lib/riffer/rig/hosts/null.rb"

Metrics:
  Enabled: false

Metrics/BlockNesting:
  Enabled: true

Minitest/MultipleAssertions:
  Max: 1

Naming/PredicateMethod:
  Exclude:
    # Hosts::_Host#confirm is a blocking prompt named by the host contract,
    # not a predicate.
    - "lib/riffer/rig/hosts/*.rb"

Rig/NoInlineRbsDeclarations:
  Enabled: true
  Include:
    - "lib/**/*.rb"

Style/ClassAndModuleChildren:
  EnforcedStyle: compact
  Exclude:
    - "lib/riffer/rig/version.rb"
    # The cop's file defines the `Rig` badge namespace itself, which the
    # compact form can't open.
    - "rubocop/**/*"

Style/Documentation:
  Enabled: false

Style/ModuleFunction:
  EnforcedStyle: extend_self
